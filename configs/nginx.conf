# Nginx reverse proxy configuration for the Pi Telegram gateway.
#
# Telegram sends webhook updates over HTTPS only. Terminate TLS at
# Nginx and proxy to the gateway on loopback.
#
# Install as /etc/nginx/sites-available/pi-telegram, symlink into
# sites-enabled, adjust the server_name and TLS certificate paths, then:
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=pi_webhook:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;

    # Let certbot keep the certificate renewed; webhook needs HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bot.example.com;

    # Certificate (adjust to your setup, e.g. certbot --nginx).
    ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Telegram webhook updates are small JSON documents.
    client_max_body_size 1m;

    # The webhook endpoint: only POST, rate-limited.
    location = /telegram/webhook {
        limit_req zone=pi_webhook burst=50 nodelay;
        if ($request_method != POST) {
            return 405;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Health check for monitoring.
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Everything else is not part of the public surface.
    location / {
        return 404;
    }
}
